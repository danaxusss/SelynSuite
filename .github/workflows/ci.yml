name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Cardinal Rule R1 — the app role must NOT be a superuser, otherwise
        # Postgres bypasses RLS. POSTGRES_USER is the bootstrap superuser; the
        # `selyn` non-superuser role is created by the "Bootstrap selyn role"
        # step below before migrations run.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://selyn:selyn_dev_password@localhost:5432/selyn_test?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-test-secret-ci-test-secret-ci-test-secret-1234

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap selyn role (non-superuser, owns selyn_test)
        env:
          PGPASSWORD: postgres_dev_password
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE selyn WITH LOGIN PASSWORD 'selyn_dev_password' CREATEDB;
            CREATE DATABASE selyn_test OWNER selyn;
          SQL
          PGPASSWORD=selyn_dev_password psql -h localhost -U selyn -d selyn_test -c "GRANT ALL ON SCHEMA public TO selyn;"

      - name: Generate Prisma client
        run: pnpm --filter @selyn/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @selyn/api exec prisma migrate deploy

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
